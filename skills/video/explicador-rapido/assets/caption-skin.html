<!--
  Piel de subtítulos estilo jato.run (palabra a palabra, sin tarjeta).

  Se copia al proyecto como .hyperframes/caption-skin.html. captions.mjs (scripts/hf/) rellena los tres huecos
  reservados, la envuelve en un <template> y escribe compositions/captions.html:
    · el arreglo GROUPS vacío           → los grupos de palabras por escena
    · la duración 0 y el ancho/alto 0   → la duración total y el tamaño del lienzo
    · el <style data-brand-tokens> vacío → las variables :root que salen de frame.md

  Contrato: usa solo estas variables (captions.mjs las inyecta): --cap-ink · --cap-canvas · --cap-accent ·
  --cap-accent-2 · --font-display · --font-body · --cap-band-top · --cap-band-height.
  Ganchos que no se renombran: .caption-group / .caption-word con los estados .is-active / .is-spoken, la raíz
  data-composition-id="captions" y el timeline en window.__timelines["captions"]. Los cambios de estado van con
  gsap.set({className}) dentro del timeline, que se aplica en cada salto de cuadro; nunca con tl.call(), que el
  render no dispara.

  Aspecto: palabras en Poppins SemiBold sobre el fondo, sin tarjeta, con una sombra suave para leerse sobre fotos.
  Las que vienen van tenues, la actual en cian y las dichas en blanco roto; marcas y cifras activas en violeta.

  Derivada de la piel de ejemplo de HyperFrames (Apache 2.0, ver scripts/hf/NOTICE.md).
-->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

<!-- captions.mjs injects the project's :root tokens here -->
<style data-brand-tokens></style>

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 1445px);
    height: var(--cap-band-height, 170px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* sin tarjeta: palabras sueltas sobre el fondo; tenues las que vienen, cian la actual, blanco roto las dichas */
  .caption-pill {
    max-width: 86%;
    padding: 10px 24px;
    background: transparent;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.1em 0.28em;
    font-family: var(--font-body, "Poppins"), system-ui, sans-serif;
    font-weight: 600;
    font-size: 54px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 14px rgba(0,0,0,0.85), 0 0 2px rgba(0,0,0,0.9);
  }
  .caption-word { display: inline-block; padding: 0 0.02em; color: rgba(237,237,237,0.38); }
  .caption-word.is-active { color: #9fe3f5; }
  .caption-word.is-spoken { color: #ededed; }
  .caption-word.cap-brand.is-active, .caption-word.cap-cta.is-active { color: #c4b5fd; }
  .caption-word.cap-num.is-active { color: #c4b5fd; }

  </style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="0"
  data-fps="30"
  data-width="0"
  data-height="0"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // captions.mjs injects the engine's scene-aware groups + real duration here.
  var GROUPS = [];
  var DURATION = 0;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        tl.fromTo(el, { scale: 0.98 }, { scale: 1, duration: 0.16, ease: "power1.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>
